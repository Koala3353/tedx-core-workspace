# Runs the reminder workers every 15 minutes.
#
# 1. dispatch-notifications: enqueues due/overdue reminders, delivers in-app notifications, and
#    enqueues typed email reminders for members who turned email on.
# 2. email-adapter: sends queued email reminders (08:00-20:00 Asia/Manila only).
#
# Both functions have verify_jwt = false (supabase/config.toml) and reject any request without their
# own shared-secret header. Secrets are set by scripts/setup-reminders.sh:
#   Settings -> Secrets and variables -> Actions -> NOTIFICATION_DISPATCH_SECRET, EMAIL_DISPATCH_SECRET
# GitHub may delay or skip scheduled runs under load; use "Run workflow" to trigger one by hand.
name: Reminders

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: reminders
  cancel-in-progress: false

env:
  FUNCTIONS_URL: https://wyurosneoxfqqrrvstke.supabase.co/functions/v1

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Dispatch notifications
        env:
          DISPATCH_SECRET: ${{ secrets.NOTIFICATION_DISPATCH_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "${DISPATCH_SECRET}" ]; then
            echo "::error::NOTIFICATION_DISPATCH_SECRET is not set. Run scripts/setup-reminders.sh."
            exit 1
          fi
          status=$(curl --silent --show-error --max-time 120 --output response.json --write-out '%{http_code}' \
            --request POST --header "x-notification-dispatch-secret: ${DISPATCH_SECRET}" \
            "${FUNCTIONS_URL}/dispatch-notifications")
          echo "dispatch-notifications HTTP ${status}: $(head -c 500 response.json)"
          [ "${status}" -ge 200 ] && [ "${status}" -lt 300 ]

      - name: Send email reminders
        env:
          DISPATCH_SECRET: ${{ secrets.EMAIL_DISPATCH_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "${DISPATCH_SECRET}" ]; then
            echo "::error::EMAIL_DISPATCH_SECRET is not set. Run scripts/setup-reminders.sh."
            exit 1
          fi
          status=$(curl --silent --show-error --max-time 300 --output response.json --write-out '%{http_code}' \
            --request POST --header "x-email-dispatch-secret: ${DISPATCH_SECRET}" \
            "${FUNCTIONS_URL}/email-adapter")
          echo "email-adapter HTTP ${status}: $(head -c 500 response.json)"
          [ "${status}" -ge 200 ] && [ "${status}" -lt 300 ]
